name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Tests with coverage
        run: pytest --cov --cov-fail-under=90

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t pdf-extractor .

      - name: Run on the bundled sample invoices
        run: |
          mkdir output
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/output:/out" \
            pdf-extractor samples -o /out/report.xlsx --strict

      - name: Check that the report was created
        run: test -s output/report.xlsx